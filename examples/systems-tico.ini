# VITRINE systems configuration.
#
# Cores are listed in preference order: VITRINE's own build first, a tico
# install second. VITRINE does not need tico - it only reads its folders.
# ROM directories come from a stock tico install. Add another "roms =" line
# per system if you keep a separate library elsewhere.
#
# If a core refuses to start a game, its argv convention differs from the
# default - set "args" for that system. Default is: "{core}" "{rom}"

[Nintendo Entertainment System]
core = sdmc:/switch/vitrine/cores/tico-fceumm.nro
core = sdmc:/tico/cores/tico-fceumm.nro
roms = sdmc:/tico/roms/nes
extensions = nes, fds, unf, unif

[Super Nintendo]
core = sdmc:/switch/vitrine/cores/tico-snes9x.nro
core = sdmc:/tico/cores/tico-snes9x.nro
roms = sdmc:/tico/roms/snes
extensions = smc, sfc, fig, swc

[Nintendo 64]
core = sdmc:/switch/vitrine/cores/tico-mupen64plus.nro
core = sdmc:/tico/cores/tico-mupen64plus.nro
roms = sdmc:/tico/roms/n64
extensions = n64, z64, v64

[GameCube]
