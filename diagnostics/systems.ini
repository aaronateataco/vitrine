# VITRINE systems configuration.
#
# One section per platform. VITRINE ships no cores and no ROMs - point
# 'core' at a core NRO you built yourself, and 'roms' at your own dumps.
#
#   core        path to the core NRO
#   roms        directory to scan, searched recursively.
#               Repeat the key to scan several libraries.
#   extensions  comma-separated, no dots
#   args        optional; {core} and {rom} are substituted
#               defaults to: "{core}" "{rom}"
#
# The sdmc:/tico paths match a stock tico install, whose cores are already
# built as standalone NROs. Directories that do not exist are skipped, so
# listing both layouts costs nothing. See examples/systems-tico.ini in the
# repository for all twenty systems.

[Nintendo Entertainment System]
core = sdmc:/tico/cores/tico-fceumm.nro
roms = sdmc:/roms/nes
roms = sdmc:/tico/roms/nes
extensions = nes, fds, unf, unif

[Super Nintendo]
core = sdmc:/tico/cores/tico-snes9x.nro
roms = sdmc:/roms/snes
roms = sdmc:/tico/roms/snes
extensions = smc, sfc, fig, swc

[Game Boy Advance]
core = sdmc:/tico/cores/tico-mgba.nro
roms = sdmc:/roms/gba
roms = sdmc:/tico/roms/gba
extensions = gba, agb

[Nintendo 64]
core = sdmc:/tico/cores/tico-mupen64plus.nro
roms = sdmc:/roms/n64
roms = sdmc:/tico/roms/n64
extensions = n64, z64, v64

[PlayStation]
core = sdmc:/tico/cores/tico-duckstation.nro
roms = sdmc:/roms/psx
roms = sdmc:/tico/roms/psx
extensions = cue, bin, chd, m3u, pbp, exe, iso
